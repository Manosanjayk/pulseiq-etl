services:
  warehouse:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulseiq_warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-pulseiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulseiq_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./sql:/opt/pulseiq/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  warehouse-load:
    build: .
    environment:
      WAREHOUSE_DATABASE_URL: postgresql://${POSTGRES_USER:-pulseiq}:${POSTGRES_PASSWORD:-pulseiq_local_only}@warehouse:5432/${POSTGRES_DB:-pulseiq_warehouse}
      CLEAN_DIR: /app/data/clean
      RAW_DIR: /app/data/raw
      REJECTED_DIR: /app/rejected
    volumes:
      - ./data:/app/data:ro
      - ./rejected:/app/rejected:ro
    depends_on:
      warehouse:
        condition: service_healthy
    command: ["python", "src/warehouse.py"]

  warehouse-test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulseiq_warehouse_test
      POSTGRES_USER: pulseiq_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-test_only_local}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  warehouse-test:
    build: .
    environment:
      WAREHOUSE_TEST_DATABASE_URL: postgresql://pulseiq_test:${POSTGRES_TEST_PASSWORD:-test_only_local}@warehouse-test-db:5432/pulseiq_warehouse_test
      CLEAN_DIR: /app/data/clean
      RAW_DIR: /app/data/raw
      REJECTED_DIR: /app/rejected
    volumes:
      - ./data:/app/data:ro
      - ./rejected:/app/rejected:ro
    depends_on:
      warehouse-test-db:
        condition: service_healthy
    command: ["python", "-m", "pytest", "-q", "tests/test_warehouse.py"]

  etl:
    build: .
    environment:
      RAW_DIR: ${RAW_DIR:-data/raw}
      CLEAN_DIR: ${CLEAN_DIR:-data/clean}
      REJECTED_DIR: ${REJECTED_DIR:-rejected}
      LOG_DIR: ${LOG_DIR:-logs}
      OUTPUT_FORMAT: ${OUTPUT_FORMAT:-csv}
      AS_OF_DATE: ${AS_OF_DATE:-2026-10-12}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./rejected:/app/rejected
    command: ["python", "src/etl.py"]

  etl-test:
    build: .
    command: ["python", "-m", "pytest", "-q", "tests/test_etl.py", "tests/test_metric_dictionary.py"]

  etl-verify:
    build: .
    environment:
      RAW_DIR: /app/data/raw
      CLEAN_DIR: /app/data/clean
      REJECTED_DIR: /app/rejected
      LOG_DIR: /app/logs
      OUTPUT_FORMAT: ${OUTPUT_FORMAT:-csv}
      AS_OF_DATE: ${AS_OF_DATE:-2026-10-12}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./rejected:/app/rejected
    command: ["sh", "-c", "python -m pytest -q tests/test_etl.py tests/test_metric_dictionary.py && python src/etl.py"]

volumes:
  warehouse_data:
