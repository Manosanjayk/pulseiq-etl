name: CI

on:
  push:
    branches:
      - main
      - task-2
      - task-2-integrated
  pull_request:
    branches:
      - main
      - task-2
      - task-2-integrated

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pulseiq_warehouse_test
          POSTGRES_USER: pulseiq_test
          POSTGRES_PASSWORD: test_only_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulseiq_test -d pulseiq_warehouse_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL unit tests and metric dictionary validation
        run: |
          pytest -v tests/test_etl.py tests/test_metric_dictionary.py

      - name: Run warehouse integration tests
        env:
          WAREHOUSE_TEST_DATABASE_URL: postgresql://pulseiq_test:test_only_ci@localhost:5432/pulseiq_warehouse_test
          CLEAN_DIR: data/clean
          RAW_DIR: data/raw
          REJECTED_DIR: rejected
        run: |
          pytest -v tests/test_warehouse.py

      - name: Run Docker CLI tests
        run: |
          pytest -v tests/test_docker.py

